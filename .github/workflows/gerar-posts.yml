name: Gerar post (blog automático)

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar direto? 1 = publica (padrão) · 0 = rascunho'
        required: false
        default: '1'
  schedule:
    - cron: '20 11 * * 1,3,5'   # 08:20 Campo Grande — seg/qua/sex

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar post
        id: gerar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLICAR:          ${{ github.event.inputs.publicar || '1' }}
        run: python3 scripts/gerar_post.py

      - name: Commitar
        run: |
          git config user.name  "Gas P20 Bot"
          git config user.email "bot@gasp20empilhadeira.com.br"
          git add blog/ sitemap.xml llms.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "blog: gera post ($(date +%F))"
            git push
          fi

      # e-mail individual DESATIVADO — substituido pelo relatorio diario
      # consolidado em moskogas-static/.github/workflows/relatorio-diario.yml
